    description: >-
      OUR Archive (Otago University Research Archive) is the University's institutional research
      repository. The DATA, the DOIs and the curation are Otago's; the CONTRACT and the
      engineering are Ex Libris / Clarivate's. This entry is the correction made in the 2026-08-30
      run: the hostname ourarchive.otago.ac.nz sits under Otago's own registrable domain, so a
      hostname-only verdict reads it as institution-operated, and that is how it was previously
      recorded. DNS resolution shows the host is a CNAME to ap02.esploro.exlibrisgroup.com
      (216.147.221.101) — an Esploro tenancy, the same shape as scholarbank.nus.edu.sg. It is
      therefore a tenant relationship, not Otago's engineering. Probed 2026-08-30: the OAI-PMH
      endpoint follows the standard Esploro pattern /view/oai/64OTAGO_INST/request and answers in
      the protocol's own XML, but every verb — Identify, ListMetadataFormats, ListSets,
      ListRecords — returns HTTP 403 with error_code 21, "Unauthorized access to the OAI
      services". Harvesting is deployed and not authorised. The repository's Esploro research
      portal (200) and its sitemap index (200, lastmod 2026-08-30) are open. The legacy DSpace
      path /oai now 404s. No Esploro contract is stored here; it belongs to Ex Libris.
    humanURL: https://ourarchive.otago.ac.nz/esploro/?institution=64OTAGO_INST
    baseURL: https://ourarchive.otago.ac.nz/view/oai/64OTAGO_INST/request
