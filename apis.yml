    contract: only one of the six recorded conformance/surface facts is Otago's own engineering.
x-coverage:
  state: covered
  reason: covered
  detail: >-
    Otago's programmable footprint was probed directly and it is small but real. One surface is
    genuinely institution-operated and keyless: the WordPress REST API at
    artificialintelligence.otago.ac.nz returns a 200,783-byte discovery document listing 144
    routes across six namespaces with an empty authentication array, and /wp-json/wp/v2/pages
    serves content anonymously. Four further surfaces are recorded as tenant relationships rather
    than as Otago contracts. Six things could not be resolved and are named rather than assumed.
    (1) www.otago.ac.nz returns 403 to every scripted request across the whole origin, including
    robots.txt, sitemap.xml and llms.txt, so the sitemap crawl used to MEASURE absence on other
    institutions in this cohort could not be run here; the "no developer portal" finding rests on
    subdomain enumeration and search instead, and is therefore weaker evidence than Adelaide's.
    (2) api.otago.ac.nz is a genuine Otago-owned hostname behind Cloudflare whose origin is an
    OpenShift router returning the default 503 "Application is not available" page on all eight
    paths probed — an API gateway with no reachable application, not credited as a surface.
    (3) OUR Archive's OAI-PMH endpoint is deployed but every verb returns 403 with OAI error_code
    21, so no metadata record was ever retrieved and conformance is recorded as gated, not
    present. (4) otago.figshare.com answers 202 with an empty body, which Figshare returns for
    both live tenancies and its wildcard, so the tenancy can be neither confirmed nor denied and
    is deliberately NOT asserted. (5) library.otago.ac.nz, hpc.otago.ac.nz and login.otago.ac.nz
    all resolve to campus addresses but do not complete a connection publicly — real internal
    services, not public surfaces. (6) The DataCite repository otagouni.qmyzok, "University of
    Otago Open Journals", is registered but its host openjournals.otago.ac.nz is NXDOMAIN and it
    holds 0 DOIs; the registration outlived the service.
