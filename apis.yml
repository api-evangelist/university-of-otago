  - aid: university-of-otago:scholarly-identifiers
    name: Otago Scholarly Identifier Registrations (DataCite + Crossref)
    x-operator: tenant
    description: >-
      Otago's persistent-identifier registrations, readable through each registry's public REST
      API. Confirmed live 2026-08-30. DataCite carries provider `otagouni` — "University of
      Otago", memberType consortium_organization, organizationType academicInstitution, country
      NZ, rorId https://ror.org/01jmxt844, created 2026-01-14 — with repository
      `otagouni.snbodh` ("OUR Archive") holding 334 registered DOIs. Crossref carries member 4843,
      "University of Otago Library", holding DOI prefix 10.11157 with 2,537 DOIs deposited (412
      current, 2,125 backfile); the depositing entity is the University Library itself, which
      makes it institution-attributed rather than a vendor's. Recorded as tenant because Otago
      holds the accounts and does the depositing while DataCite and Crossref run the endpoints.
      A second DataCite repository, `otagouni.qmyzok` ("University of Otago Open Journals"), is
      registered but holds 0 DOIs and its host openjournals.otago.ac.nz is NXDOMAIN — the
      registration outlived the service, and it is recorded as a finding rather than a surface.
    humanURL: https://ror.org/01jmxt844
    baseURL: https://api.datacite.org/providers/otagouni
    tags: [ DataCite, Crossref, DOI, Persistent Identifiers, Metadata, Research, Tenant ]
    properties:
