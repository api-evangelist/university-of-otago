  - aid: university-of-otago:blackboard-learn
    name: Blackboard Learn — University of Otago tenancy
    x-operator: tenant
    description: >-
      The University's learning management system runs on Anthology Blackboard Learn at
      blackboard.otago.ac.nz, which CNAMEs to otago.blackboard.com and on to AWS ap-southeast-2.
      The tenancy, roster and course content are Otago's; the API contract is Blackboard's. Newly
      recorded in the 2026-08-30 run — the June profile did not find it. Probed 2026-08-30:
      /learn/api/public/v1/system/version answers keyless with
      {"learn":{"major":4000,"minor":21,"patch":0,"build":"rel.28+435d029"}}, and every
      data-bearing endpoint returns HTTP 401 with {"status":401,"message":"API request is not
      authenticated."} — confirmed on /learn/api/public/v1/courses,
      /learn/api/public/v1/dataSources and /learn/api/public/v3/courses. A 401 rather than a 404
      is the evidence the API exists and is gated. The baseURL below records the API base, not a
      callable document: a bare GET to /learn/api/public/v1 returns 400, as Blackboard does on
      every deployment. Credentials are REST application keys are issued only by Otago
      administrators. NO LTI CONFORMANCE IS CLAIMED: /.well-known/openid-configuration returns
      HTTP 200 but its body is Blackboard's login.jsp HTML page, a soft-200 rather than an OIDC
      discovery document. Blackboard's contract is not stored here.
    humanURL: https://blackboard.otago.ac.nz/
