description: >-
  The University of Otago — Te Whare Wānanga o Ōtākou — is New Zealand's oldest university,
  founded in 1869 in Dunedin and registered as https://ror.org/01jmxt844. It operates no public
  developer program: there is no developer portal, no API reference, no open-data portal and no
  OpenAPI published under any otago.ac.nz path found in this run. Exactly ONE machine-readable
  surface is both on Otago's own domain and operated by Otago — the self-hosted WordPress REST
  API behind its AI guidance site at artificialintelligence.otago.ac.nz, which serves a 144-route
  discovery document and published content keyless. Everything else that carries an Otago name is
  a vendor contract running under it: OUR Archive at ourarchive.otago.ac.nz is an Ex Libris /
  Clarivate Esploro tenancy (the hostname is Otago's, the CNAME goes to
  ap02.esploro.exlibrisgroup.com) whose OAI-PMH endpoint is deployed but refuses public
  harvesting with error_code 21; blackboard.otago.ac.nz is an Anthology Blackboard Learn tenancy
  running release 4000.21.0 whose REST API answers 401 to everything but a version check; and
  Otago's SAML 2.0 identity is published in the signed Tuakiri NZ Access Federation metadata
  under entityID https://idp.otago.ac.nz/idp/shibboleth while every one of its SSO bindings
  actually resolves to REANNZ's Tuakiri Hosted Login service. Otago's scholarly identifier
  registrations are real and institution-attributed — DataCite provider otagouni with 334 DOIs in
  OUR Archive, and Crossref member 4843 "University of Otago Library" holding prefix 10.11157
  with 2,537 DOIs. This profile is deliberately thin because the footprint is thin, and the
  surfaces that exist are recorded under the operator that actually runs them.
