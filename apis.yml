    same way: Otago owns the entityID, REANNZ operates the IdP. Three surfaces the June profile
    missed were found and added — the self-hosted WordPress REST API at
    artificialintelligence.otago.ac.nz (the only genuinely institution-operated machine-readable
    surface Otago has), the Blackboard Learn tenancy, and the DataCite/Crossref registrations.
    Four artifacts were built from live probes. Two soft-200s were caught and are recorded as
    non-finds rather than as surfaces: /esploro/openapi returns the Esploro SPA shell, and
